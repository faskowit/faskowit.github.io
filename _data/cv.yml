cv:
  name: Joshua Faskowitz
  label: Postdoctoral Fellow
  email: faskowitzji@nih.gov
  location: Bethesda, MD
  image: ""
  summary: I study how large-scale brain organization emerges from interactions among networks, with an emphasis on edge-centric models, mesoscale structure, and the interpretation of functional MRI signals. My work combines network science, computational modeling, and neuroimaging analysis to develop methods for understanding brain structure, function, and dynamics across space and time.

  social_networks:
    - network: GitHub
      username: faskowit
    - network: LinkedIn
      username: joshuafaskowitz
    - network: X
      username: joshfasky

  sections:
    Education:
      - institution: Indiana University Bloomington
        location: Bloomington, IN
        area: Neuroscience and Psychology
        degree: PhD
        start_date: 2016
        end_date: 2021
        highlights:
          - "Advisor: Dr. Olaf Sporns"
          - "Committee: Dr. Olaf Sporns, Dr. Aina Puce, Dr. Amanda Mejia, and Dr. Richard Betzel"

      - institution: University of Southern California
        location: Los Angeles, CA
        area: Neuroscience and Cognitive Science
        degree: BA
        start_date: 2010
        end_date: 2014

    Experience:
      - company: National Institute of Mental Health
        position: Postdoctoral Fellow, Section on Functional Imaging Methods
        location: Bethesda, MD
        start_date: 2022
        summary: "PI: Dr. Peter Bandettini"
        highlights:
          - Develop and apply methods for characterizing fMRI correlation structure across space and time.
          - Study how preprocessing, physiology, and signal interpretation shape inferences about functional brain organization.

      - company: IU Department of Psychological and Brain Sciences
        position: Postdoctoral Researcher
        location: Bloomington, IN
        start_date: 2021
        end_date: 2022
        summary: "PIs: Dr. Olaf Sporns and Dr. Richard Betzel"
        highlights:
          - Extended edge-centric and community-based network models for studies of human brain organization.
          - Supported collaborative neuroimaging and network science projects through analysis, mentoring, and shared computational workflows.

      - company: IU Computational Cognitive Neuroscience Lab
        position: Graduate Student
        location: Bloomington, IN
        start_date: 2016
        end_date: 2021
        summary: "PI: Dr. Olaf Sporns"
        highlights:
          - Investigated mesoscale organization, edge-centric representations, and time-varying structure in structural and functional brain networks.
          - Collaborated across labs on methods, data sharing, and reproducible computational analyses in network neuroscience.

      - company: USC Imaging Genetics Center
        position: Project Assistant
        location: Los Angeles, CA
        start_date: 2014
        end_date: 2016
        summary: "PI: Dr. Paul Thompson; under supervision of Dr. Neda Jahanshad"
        highlights:
          - Processed MRI data into analysis-ready neuroimages by designing reproducible workflows.

      - company: USC Emotion and Cognition Lab
        position: Undergraduate Research Assistant
        location: Los Angeles, CA
        start_date: 2012
        end_date: 2014
        summary: "PI: Dr. Mara Mather; under supervision of Dr. Allison Ponzio"
        highlights:
          - Administered experiments over five semesters and one summer, totaling more than 800 lab hours.

    Research Areas:
      - label: Focus
        details: Network neuroscience; network science algorithms and applications; community detection; edge-centric modeling; fMRI analysis and interpretation; time-varying connectivity

